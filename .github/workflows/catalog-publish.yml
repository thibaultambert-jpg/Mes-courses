name: Publier le catalogue

# Rassemble les fichiers bruts de la dernière collecte (même en cours : on prend le dernier passage terminé de chaque site),
# les publie en *.source.jsonl.gz, applique la rationalisation et la vectorisation, puis publie la release « catalogue ».
# Se lance en poussant tools/catalog/publish.conf ou manuellement.
on:
  workflow_dispatch:
    inputs:
      rebuild_android:
        description: "Relancer la compilation de l'APK après publication"
        type: boolean
        required: false
        default: false
  push:
    branches: ["claude/**"]
    paths:
      - tools/catalog/publish.conf

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogue-release
  cancel-in-progress: false

jobs:
  publier:
    uses: ./.github/workflows/catalog-release.yml
    with:
      source: raw
      raw_from: collect
      rebuild_android: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_android == true }}

name: Catalogue — mise à jour quotidienne

# Chaque nuit : relit les fiches nouvelles ou modifiées de chaque site à partir des bases brutes déjà publiées
# (<site>.source.jsonl.gz dans la release « catalogue »), rationalise et vectorise les bases pour l'appli,
# puis republie la release « catalogue ».
# Les bases publiées sont téléchargées automatiquement en priorité par l'appli (CI-first, hors données mobiles) :
# aucune recompilation de l'APK n'est déclenchée après publication.
# Les déclencheurs planifiés ne tournent que sur la branche par défaut (main).
on:
  schedule:
    - cron: "0 22 * * *" # tous les jours, 22 h 00 UTC (23 h 00 heure de Paris en hiver)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogue-release
  cancel-in-progress: false

jobs:
  maj:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        site: [cuisineaz, ptitchef, marmiton, chefsimon, hellofresh, jow, jdf, 750g, cuisineactuelle, cuisineaddict, picnic]
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Point de départ : la base brute publiée du site (<site>.source.jsonl.gz), et l'état de lecture (pages déjà vues, dont celles sans recette) s'il existe.
      # Sans base source publiée, rien à mettre à jour : aucun repli sur <site>.jsonl.gz (base rationalisée et vectorisée).
      - name: Reprendre la base publiée
        id: base
        run: |
          mkdir -p catalog
          if ! gh release download catalogue --repo "$GITHUB_REPOSITORY" --dir catalog \
              --pattern "${SITE}.source.jsonl.gz" --pattern "${SITE}.seen.tsv.gz" --clobber \
              || [ ! -f "catalog/${SITE}.source.jsonl.gz" ]; then
            echo "Pas de base source publiée pour $SITE : site ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mv "catalog/${SITE}.source.jsonl.gz" "catalog/${SITE}.jsonl.gz"
          gunzip -f catalog/*.gz
          echo "ok=true" >> "$GITHUB_OUTPUT"
          wc -l "catalog/${SITE}.jsonl"

      - name: Lecture des nouveautés
        if: steps.base.outputs.ok == 'true'
        run: |
          set -o pipefail
          ./gradlew -q -p tools/catalog run --args="build --site $SITE --out $PWD/catalog --minutes 320" | tee pass.log
          tail -3 pass.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.base.outputs.ok == 'true'
        with:
          name: daily-${{ matrix.site }}
          path: |
            catalog/${{ matrix.site }}.jsonl
            catalog/${{ matrix.site }}.seen.tsv
          retention-days: 3

  publier:
    needs: maj
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/catalog-release.yml
    with:
      source: raw
      raw_from: daily
      rebuild_android: false

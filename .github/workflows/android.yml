name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du module core (logique métier, MCP)
        run: ./gradlew -p core test --stacktrace

      - name: Clé de signature fixe (si les secrets existent)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Pas de secret SIGNING_KEYSTORE_BASE64 : signature avec la clé de debug."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mescourses.jks"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/mescourses.jks"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Clé fixe prête."

      - name: Compilation de l'APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mes-courses-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            core/build/reports/tests/
            app/build/reports/

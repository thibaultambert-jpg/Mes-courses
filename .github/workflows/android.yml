name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du module core (logique métier, MCP)
        run: ./gradlew -p core test --stacktrace

      - name: Clé de signature fixe (si les secrets existent)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Pas de secret SIGNING_KEYSTORE_BASE64 : signature avec la clé de debug."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mescourses.jks"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/mescourses.jks"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Clé fixe prête."

      - name: Catalogue de recettes embarqué (s'il est publié)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/catalog
          gh release download catalogue --repo "$GITHUB_REPOSITORY" --dir app/src/main/assets/catalog \
            --pattern '*.jsonl.gz' --pattern 'version.txt' --clobber || echo "Pas de catalogue publié : l'appli démarre avec un catalogue vide."
          rm -f app/src/main/assets/catalog/*.source.jsonl.gz
          ls -la app/src/main/assets/catalog

      - name: Compilation de l'APK
        run: ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mes-courses-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            core/build/reports/tests/
            app/build/reports/

      # L'appli cherche cette release pour se mettre à jour toute seule (Réglages › Mise à jour de l'appli).
      # Le corps de la release contient le numéro de build ; l'APK doit être signé avec la clé fixe pour s'installer par-dessus.
      - name: Publication pour la mise à jour dans l'appli
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk mes-courses.apk
          if ! gh release view appli >/dev/null 2>&1; then
            gh release create appli --title "Mes courses (dernière version)" --notes "${{ github.run_number }}" --latest=false
          fi
          gh release upload appli mes-courses.apk --clobber
          gh release edit appli --notes "${{ github.run_number }}"

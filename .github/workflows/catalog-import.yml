name: Catalogue — import de la base consolidée

# Mise en service du catalogue vectorisé : découpe la base consolidée (tools/catalog/data/catalogue-rationalise-v2.jsonl.gz),
# migre une seule fois les anciens <site>.jsonl.gz en <site>.source.jsonl.gz, calcule les vecteurs, publie la release
# « catalogue », puis relance la compilation de l'APK.
on:
  workflow_dispatch:
    inputs:
      rebuild_android:
        description: "Relancer la compilation de l'APK après publication"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogue-release
  cancel-in-progress: false

jobs:
  import:
    uses: ./.github/workflows/catalog-release.yml
    with:
      source: import
      rebuild_android: ${{ inputs.rebuild_android }}

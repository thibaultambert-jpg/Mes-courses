name: Catalogue — un passage sur un site

# Lit les fiches d'un site qui ne l'ont pas encore été, puis range l'état pour le passage suivant.
on:
  workflow_call:
    inputs:
      site:
        required: true
        type: string
      pass:
        required: true
        type: string
      # Numéro d'un run de collecte dont on reprend le fichier du site quand aucun état n'est disponible dans le cache
      # (les caches ne passent pas d'une branche à l'autre).
      seed_run:
        required: false
        type: string
        default: ""

jobs:
  collect:
    name: ${{ inputs.site }} (passage ${{ inputs.pass }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # L'état (fiches déjà lues) passe d'un passage à l'autre, et d'une collecte à la suivante.
      - name: Reprendre l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: catalog
          key: catalog-${{ inputs.site }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass }}
          # Avec seed_run (rattrapage), seul l'état du même run compte : un cache d'un rattrapage précédent peut être partiel.
          restore-keys: |
            catalog-${{ inputs.site }}-${{ inputs.seed_run != '' && format('{0}-', github.run_id) || '' }}

      - name: Reprendre le fichier d'une collecte précédente
        if: ${{ inputs.seed_run != '' && hashFiles(format('catalog/{0}.jsonl', inputs.site)) == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "${{ inputs.seed_run }}" --pattern "catalog-${{ inputs.site }}-*" --dir seed
          last=$(ls -d seed/catalog-${{ inputs.site }}-* | sort -V | tail -1)
          mkdir -p catalog
          cp "$last/${{ inputs.site }}.jsonl" catalog/
          echo "Fichier repris de $last : $(wc -l < catalog/${{ inputs.site }}.jsonl) lignes"

      - name: Collecte
        run: |
          set -a; . tools/catalog/pass.conf; set +a
          ARGS="build --site ${{ inputs.site }} --out $PWD/catalog --minutes ${MINUTES:-320}"
          if [ "${LIMIT:-0}" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          set -o pipefail
          ./gradlew -q -p tools/catalog run --args="$ARGS" | tee pass.log
          tail -3 pass.log >> "$GITHUB_STEP_SUMMARY"

      - name: Ranger l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: catalog
          key: catalog-${{ inputs.site }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pass }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-${{ inputs.site }}-${{ inputs.pass }}
          path: catalog/${{ inputs.site }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # Les fiches encore en erreur à la fin du passage (toutes, avec leur message) : sert à programmer un rattrapage.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erreurs-${{ inputs.site }}-${{ inputs.pass }}
          path: catalog/${{ inputs.site }}.erreurs.tsv
          if-no-files-found: ignore
          retention-days: 14

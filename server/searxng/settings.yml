# Configuration minimale de SearXNG pour l'application « Mes courses ».
use_default_settings: true

general:
  instance_name: "mes-courses"

server:
  # Remplace par une valeur aléatoire (openssl rand -hex 32)
  secret_key: "remplace-moi-par-une-valeur-aleatoire"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  default_lang: "fr-FR"
  # L'application interroge SearXNG en JSON
  formats:
    - html
    - json

# Recherche web auto-hébergée pour trouver des recettes (sans clé d'API).
# Les MCP drive, eux, tournent directement sur la machine (ils ont besoin d'un vrai Chrome) : voir start.sh.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: mes-courses-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
